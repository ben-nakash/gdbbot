name: GDB watcher

on:
  schedule:
    - cron: "*/30 * * * *"      # כל חצי שעה מתחילה ריצה (ממתינה בתור עד שהקודמת מסתיימת)
  workflow_dispatch:
    inputs:
      announce:
        description: "לפרסם את המצב הנוכחי לערוץ (לבדיקה)"
        type: boolean
        default: true

# רק ריצה אחת בכל רגע; הבאה ממתינה בתור, כך שיש כיסוי רציף
concurrency:
  group: gdb-watcher
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # כדי שהתזמון לא יכבה אחרי 60 יום בלי פעילות

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - name: Restore last state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: gdb-state-${{ github.run_id }}
          restore-keys: gdb-state-

      - name: Watch Wolt for 55 minutes
        run: python3 gdb_watch.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          RUN_MINUTES: "55"
          POLL_SECONDS: "30"
          ANNOUNCE: ${{ inputs.announce && '1' || '' }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: gdb-state-${{ github.run_id }}

      - name: Keep schedule alive
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/gdb.yml/enable" || true
        env:
          GH_TOKEN: ${{ github.token }}
